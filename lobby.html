.lobby{position:relative;width:100%;height:100%;min-height:320px;isolation:isolate}
.lobby:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,9,22,.34),transparent 24%,transparent 72%,rgba(2,8,18,.38))}
.frame{position:absolute;inset:10px;border:1px solid rgba(47,177,255,.42);pointer-events:none;box-shadow:inset 0 0 28px rgba(0,140,255,.08)}
.frame:before,.frame:after{content:"";position:absolute;width:clamp(55px,10vw,150px);height:5px;background:linear-gradient(90deg,transparent,var(--blue));top:0;right:0;box-shadow:0 0 12px var(--blue)}
.frame:after{top:auto;bottom:0;right:auto;left:0;transform:rotate(180deg)}
.player{position:absolute;top:3.2%;left:50%;transform:translateX(-50%);min-width:clamp(180px,25vw,330px);padding:10px 24px;text-align:center;background:linear-gradient(100deg,rgba(4,17,36,.55),rgba(6,37,67,.88),rgba(4,17,36,.55));border:1px solid rgba(104,203,255,.8);clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);box-shadow:0 0 18px rgba(0,156,255,.35);font-size:clamp(15px,2vw,24px);font-weight:bold;text-shadow:0 0 9px #54caff}
.brand{position:absolute;top:4%;left:3%;direction:ltr;text-align:left;color:#f1f6fb;text-shadow:0 2px 8px #00182e}
.brand strong{display:block;font-size:clamp(19px,3vw,38px);letter-spacing:.5px}
.brand span{display:block;color:#72ceff;font-weight:bold;font-size:clamp(10px,1.45vw,17px);letter-spacing:2px;margin-top:3px}
.right-menu{position:absolute;right:3.2%;top:50%;transform:translateY(-50%);width:clamp(175px,26vw,360px);display:flex;flex-direction:column;gap:clamp(10px,2.1vh,22px)}
.menu-btn{position:relative;min-height:clamp(58px,11vh,104px);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#f6fbff;background:linear-gradient(105deg,rgba(5,20,42,.9),rgba(8,48,80,.82),rgba(3,15,33,.94));border:1px solid rgba(143,207,241,.9);border-right:4px solid var(--blue);clip-path:polygon(5% 0,95% 0,100% 18%,100% 82%,95% 100%,5% 100%,0 82%,0 18%);box-shadow:0 0 13px rgba(0,151,255,.3),inset 0 0 17px rgba(20,142,220,.16);font-size:clamp(17px,2.3vw,29px);font-weight:bold;cursor:pointer;transition:transform .16s,filter .16s}
.menu-btn:after{content:"";position:absolute;inset:4px;border:1px solid rgba(87,177,224,.23);pointer-events:none;clip-path:inherit}
.menu-btn:hover,.menu-btn:focus-visible{transform:translateX(-5px);filter:brightness(1.25);outline:none}
.menu-btn:active{transform:scale(.985)}
.menu-btn.primary{border-color:#f0c66a;border-right-color:#ffbd42;box-shadow:0 0 18px rgba(255,176,45,.28),inset 0 0 18px rgba(17,145,255,.18)}
.btn-icon{width:clamp(28px,4.2vw,48px);height:clamp(28px,4.2vw,48px);flex:0 0 auto;filter:drop-shadow(0 0 5px rgba(105,205,255,.55))}
.btn-arrow{color:#41c8ff;font-size:1.3em;line-height:1}
.stage{position:absolute;left:29%;top:19%;width:39%;height:72%;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;touch-action:pan-y}
.stage-label{position:absolute;top:4%;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(205,232,250,.55);letter-spacing:1px;white-space:nowrap}
.platform{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);width:min(92%,510px);height:17%;border-radius:50%;border:2px solid rgba(48,190,255,.9);background:radial-gradient(ellipse,rgba(30,158,255,.2),rgba(4,18,38,.58) 60%,rgba(1,9,21,.9));box-shadow:0 0 12px #078fe0,0 0 34px rgba(0,142,255,.55),inset 0 0 22px rgba(0,177,255,.35)}
.platform:before{content:"";position:absolute;inset:17% 9%;border-radius:50%;border:2px solid rgba(98,213,255,.75);box-shadow:0 0 12px rgba(0,170,255,.7)}
.platform:after{content:"";position:absolute;inset:35% 24%;border-radius:50%;border:1px solid rgba(190,234,255,.5)}
/* Mount the original GLB character inside #character-stage in the main game project. */
#character-stage{position:absolute;inset:8% 4% 10%;display:flex;align-items:center;justify-content:center;pointer-events:none}
#character-stage canvas{width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;bottom:4%;transform:translate(-50%,14px);padding:10px 18px;border:1px solid rgba(75,190,255,.7);background:rgba(3,17,34,.92);color:#eaf8ff;border-radius:7px;opacity:0;transition:.2s;pointer-events:none;font-size:13px;white-space:nowrap;box-shadow:0 0 18px rgba(0,142,255,.24)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){
 .brand{top:3%;left:3%}.brand strong{font-size:17px}.brand span{font-size:9px}
 .player{top:3%;left:53%;min-width:150px;padding:8px 16px;font-size:15px}
 .right-menu{right:2.5%;width:34%;gap:12px;top:53%}
 .menu-btn{min-height:58px;padding:8px 9px;font-size:clamp(13px,3.2vw,18px);gap:6px}
 .btn-icon{width:25px;height:25px}
 .stage{left:22%;top:20%;width:46%;height:72%}
}
@media(max-height:430px){
 .right-menu{top:53%;gap:7px;width:24%}.menu-btn{min-height:48px}
 .stage{top:18%;height:77%}.player{top:2%;padding:5px 18px}
}
</style>
</head>
<body>
<main class="lobby" aria-label="لوبي لعبة هيمنة الفريق">
 <div class="frame"></div>
 <header class="brand"><strong>هيمنة الفريق</strong><span>TEAM DOMINANCE</span></header>
 <div class="player" id="player-name">مجيب صالح</div>

 <section class="stage" id="character-stage" aria-label="مساحة عرض شخصية اللاعب">
   <div class="stage-label">CHARACTER DISPLAY AREA · GLB</div>
   <div class="platform"></div>
 </section>

 <nav class="right-menu" aria-label="القائمة الرئيسية">
  <button class="menu-btn primary" type="button" data-action="play">
   <svg class="btn-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 7-5 27 27-5 7L7 11Z"/><path d="m41 11-7-5L7 33l5 7 29-29Z"/><path d="m16 15-5 5m22 8 5-5"/></svg>
   <span>لعب مباراة</span><b class="btn-arrow">‹</b>
  </button>
  <button class="menu-btn" type="button" data-action="loadout">
   <svg class="btn-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M17 7h14l4 6 7 3v25H6V16l7-3 4-6Z"/><path d="M17 7v8h14V7M6 19h36M18 19v22m12-22v22M6 29h36"/></svg>
   <span>العتاد</span><b class="btn-arrow">‹</b>
  </button>
  <button class="menu-btn" type="button" data-action="settings">
   <svg class="btn-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="8"/><path d="M20 4h8l1.5 5.2 4 1.7 4.8-2.4 5.7 5.7-2.4 4.8 1.7 4L48 24v8l-5.2 1.5-1.7 4 2.4 4.8-5.7 5.7-4.8-2.4-4 1.7L28 52h-8l-1.5-5.2-4-1.7-4.8 2.4L4 41.8l2.4-4.8-1.7-4L0 31.5v-8l5.2-1.5 1.7-4-2.4-4.8 5.7-5.7 4.8 2.4 4-1.7L20 4Z" transform="translate(2 0) scale(.92)"/></svg>
   <span>الإعدادات</span><b class="btn-arrow">‹</b>
  </button>
 </nav>
 <div class="toast" id="toast">زر الواجهة جاهز للربط مع نظام اللعبة</div>
</main>
<script>
/*
  INTEGRATION CONTRACT
  - Mount your existing Three.js/WebGL GLB character in #character-stage.
  - Listen for:
      lobby:play      -> open your existing map/match selection flow
      lobby:loadout   -> open your existing weapons/equipment flow
      lobby:settings  -> open your existing settings flow
      lobby:rotate-character -> { deltaX, deltaY } from pointer drag
  - No map, player, weapon, or server assets are replaced by this UI.
*/
const toast=document.getElementById('toast');
let toastTimer;
function showToast(message){
 toast.textContent=message;toast.classList.add('show');
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}
document.querySelectorAll('[data-action]').forEach(button=>{
 button.addEventListener('click',()=>{
   const action=button.dataset.action;
   const event=new CustomEvent('lobby:'+action,{bubbles:true,detail:{source:'lobby-ui'}});
   const handled=document.dispatchEvent(event);
   // The game can set window.TEAM_DOMINANCE_LOBBY_HANDLED=true in its listener.
   if(!window.TEAM_DOMINANCE_LOBBY_HANDLED) showToast('واجهة '+button.innerText.trim()+' جاهزة للربط');
   window.TEAM_DOMINANCE_LOBBY_HANDLED=false;
 });
});
const stage=document.getElementById('character-stage');
let dragging=false,lastX=0,lastY=0;
stage.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const deltaX=e.clientX-lastX,deltaY=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
 stage.dispatchEvent(new CustomEvent('lobby:rotate-character',{bubbles:true,detail:{deltaX,deltaY}}));
});
stage.addEventListener('pointerup',()=>dragging=false);
stage.addEventListener('pointercancel',()=>dragging=false);
</script>
